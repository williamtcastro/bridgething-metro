<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- metro: a start screen in miniature. one medium, two small and one wide tile in the WP grid proportions
       (medium = 2 small + gap, wide = medium + small + gap); deliberately not a 2x2 of equal squares -->
  <rect width="256" height="256" fill="#1ba1e2"/>
  <g fill="#fff">
    <rect x="42" y="42" width="112" height="112"/>
    <rect x="162" y="42" width="52" height="52"/>
    <rect x="162" y="102" width="52" height="52" fill-opacity="0.6"/>
    <rect x="42" y="162" width="172" height="52" fill-opacity="0.85"/>
  </g>
</svg>
